<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAQ · Airreve</title>
<meta name="description" content="Airreve frequently asked questions — MOQ, manufacturing, HOCl, export documents and pricing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@100..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="sf" data-page="faq">
<div class="storefront-shell">
  <main class="content">
    <main>
      <section class="hm">
        <div class="sf-wrap">
          <h1 class="sf-h1">FAQ</h1>
          <p class="u-sub fq-count" id="faq-count"></p>
        </div>
      </section>
      <section>
        <div class="sf-wrap">
          <ul class="fq-list" id="faq-list"></ul>
          <section class="sf-sec sf-sec--bg-inverse sf-sec--panel" style="margin-bottom:var(--space-8)">
            <div class="sf-wrap">
              <div class="sf-col sf-col--center sf-col--fg-on-ink">
                <div class="sf-col__inner" style="display:flex;flex-direction:column;gap:var(--space-2);align-items:center">
                  <h2 class="sf-fmt-text">Still have a question?</h2>
                  <p class="sf-fmt-text">Tell us what you need, and we will provide the information or a quote.</p>
                  <div class="sf-links">
                    <button class="sf-btn" type="button" data-quote-open>Request a quote</button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>
  </main>
  <div data-footer></div>
</div>
<script src="js/data.js"></script>
<script src="js/chrome.js"></script>
<script src="js/app.js"></script>
</body>
</html>
