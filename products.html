<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products · Airreve</title>
<meta name="description" content="2 items · 1 categories · MOQ from 1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@100..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="sf" data-page="products" data-pview="grid">
<div class="storefront-shell">
  <main class="content">
    <main>
      <section class="u-head">
        <div class="sf-wrap">
          <nav class="u-crumb" aria-label="Breadcrumb">
            <a href="index.html">Home</a><span> / </span><span>Products</span>
          </nav>
          <h1 class="sf-h3 u-head__h">Products</h1>
          <p class="u-sub u-head__sub" id="u-sub"></p>
        </div>
      </section>

      <section>
        <div class="sf-wrap">
          <div class="u-bar">
            <label class="u-find">
              <svg class="u-find__ico" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
                <circle cx="7" cy="7" r="4.4"></circle><path d="M10.4 10.4 14 14"></path>
              </svg>
              <input class="u-input" id="u-find-input" type="search" placeholder="Search products by name or SKU"
                aria-label="Search products by name or SKU">
            </label>
            <div class="u-chips" id="u-chips" aria-label="Categories"></div>
            <select class="u-sel" id="u-cat" aria-label="Category"></select>
            <select class="u-sel" id="u-moq" aria-label="MOQ"></select>
            <select class="u-sel" id="u-sort" aria-label="Sort"></select>
            <span class="sf-nav__spacer u-bar__spacer"></span>
            <span class="u-count" id="u-count"></span>
            <div class="u-view" role="group" aria-label="View mode">
              <button class="u-view__b u-view__b--on" type="button" data-view="grid" aria-label="Grid view">
                <span class="u-view__g" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Grid
              </button>
              <button class="u-view__b" type="button" data-view="table" aria-label="Table view">
                <span class="u-view__i" aria-hidden="true"><i></i><i></i><i></i></span>Table
              </button>
            </div>
          </div>
          <div id="u-tiles"></div>
          <table class="u-table" id="u-table">
            <thead>
              <tr>
                <th scope="col"><span class="sf-sr-only">Thumbnail</span></th>
                <th scope="col">Product</th>
                <th scope="col">MOQ</th>
                <th scope="col">Lead time</th>
                <th scope="col">Origin</th>
                <th scope="col"><span class="sf-sr-only">Action</span></th>
              </tr>
            </thead>
            <tbody id="u-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </main>
  <div data-footer></div>
</div>
<script src="js/data.js"></script>
<script src="js/chrome.js"></script>
<script src="js/app.js"></script>
</body>
</html>
